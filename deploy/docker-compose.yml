services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blokpass
      # Mot de passe fort, lu depuis le fichier .env (jamais de valeur en dur).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans backend/.env}
      POSTGRES_DB: blokpass
    volumes:
      - blokpass_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blokpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stockage objet interne (pieces jointes chiffrees). Non expose a l'exterieur.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?definir S3_ACCESS_KEY dans backend/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?definir S3_SECRET_KEY dans backend/.env}
    volumes:
      - blokpass_minio:/data
    # Aucun port publie : MinIO n'est accessible que par les autres conteneurs.

  # Creation du bucket au demarrage (idempotent), puis sortie.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir S3_ACCESS_KEY dans backend/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir S3_SECRET_KEY dans backend/.env}
      # Authentification OPAQUE (aPAKE) : base64 du ServerSetup.
      # Optionnelle : si absente, les routes OPAQUE sont indisponibles et le
      # serveur demarre normalement (mode herite).
      OPAQUE_SERVER_SETUP: ${OPAQUE_SERVER_SETUP:-}
      S3_BUCKET: ${S3_BUCKET:-blokpass-attachments}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do echo 'attente de MinIO...'; sleep 2; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'bucket pret';
      exit 0;
      "

  sync:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: blokpass
      DB_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans backend/.env}
      DB_NAME: blokpass
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      # Limitation de debit anti-brute-force sur /v1/auth/* (par IP).
      AUTH_RATE_MAX: ${AUTH_RATE_MAX:-20}
      AUTH_RATE_WINDOW_SECS: ${AUTH_RATE_WINDOW_SECS:-60}
      # Administrateurs de la console (handles separes par des virgules), lus depuis .env
      ADMIN_HANDLES: ${ADMIN_HANDLES:-}
      # Cle de chiffrement au repos de l'empreinte d'authentification (32 octets base64).
      AUTH_ENC_KEY: ${AUTH_ENC_KEY:?definir AUTH_ENC_KEY dans backend/.env}
      # Stockage objet des pieces jointes (MinIO interne).
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-blokpass-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir S3_ACCESS_KEY dans backend/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir S3_SECRET_KEY dans backend/.env}
    ports:
      - "127.0.0.1:8090:8080"

  # Tests de bout en bout (sync + bootstrap) : docker compose --profile test run --rm synctest
  synctest:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: backend/Dockerfile.test
    depends_on:
      sync:
        condition: service_started
    environment:
      SYNC_URL: http://sync:8080

volumes:
  blokpass_db:
  blokpass_minio:
