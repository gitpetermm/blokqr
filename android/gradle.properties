org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2560m -XX:+UseParallelGC
# --- R8 : reduction OPTIMISEE des ressources (recommandation Play) ----------
# Supprime aussi les entrees de ressources inutilisees du binaire (et pas
# seulement leur contenu). Supporte par AGP 8.6+ ; devient le defaut en AGP 9.
android.r8.optimizedResourceShrinking=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=false
android.newDsl=false