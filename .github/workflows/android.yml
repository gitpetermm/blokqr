name: Android - Build BlokQR

# Construit l'app Android dans la CI (les builds Android ne tournent PAS sur le
# VPS : le VPS heberge l'API, l'app tourne sur les telephones). Ce workflow
# produit un APK de debug a chaque push touchant android/, et un APK/AAB signe
# sur tag (v*).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"

permissions:
  contents: write   # pour publier une Release sur tag

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Genere le wrapper s'il n'a pas encore ete commite (premier build).
      - name: Wrapper si absent
        run: if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.9; fi

      - name: Lint + tests + APK de debug
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Publier l'APK de debug (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: blokqr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # --- Build signe : uniquement sur tag v* ---------------------------------
      - name: Decoder le keystore (release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: APK + AAB signes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Publier la Release GitHub (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
